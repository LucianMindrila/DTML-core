# Operation schema — draft v0.1
# A manufacturing process performed to create one or more Features. Must
# remain machine-independent — a machine-specific cycle belongs in a
# capability profile / post-processor, not here. See
# docs/Specifications/OperationSpecification.md for the Feature / Operation
# / capability-resolution boundary this schema enforces, and
# docs/Specifications/SchemaConventions.md and docs/Architecture.md.
$id: operation.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
$ref: "#/$defs/operation"
$defs:
  operation:
    allOf:
      - $ref: "common.schema.yaml#/$defs/knowledge_object"
      - type: object
        required: [operation_type]
        properties:
          operation_type:
            type: string
            enum: [drill, route, profile_cut, pocket, groove, edge_band, manual_assembly]
          parameters:
            type: object
            description: >
              Process-level parameters genuinely independent of which
              Feature invokes this Operation (e.g. a tolerance class) —
              never resulting geometry (diameter, depth, hole_form —
              Feature-owned, see OperationSpecification.md) and never
              machine-specific execution settings (tool ID, feed rate,
              spindle speed — future capability-resolution-owned). Left
              open-ended in v0.1 — per-operation-type parameter schemas
              are future work. Most v0.1 entries are expected to have
              empty parameters, as vertical_drill does.
            additionalProperties: true
    unevaluatedProperties: false
