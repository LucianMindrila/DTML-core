# Part schema — draft v0.2
# See docs/Specifications/PartSpecification.md for rationale (currently
# describes the v0.1 shape — pending update to match this revision) and
# docs/Specifications/SchemaConventions.md for the shared conventions
# (origin, face/edge naming, expressions, references, provenance) this
# schema relies on.
#
# v0.2 replaces the inline holes/grooves arrays with Feature instances:
# a Part instantiates a reusable Feature definition (feature.schema.yaml)
# rather than embedding hole/groove geometry directly.
$id: part.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
$ref: "#/$defs/part"
$defs:
  feature_instance:
    type: object
    description: >
      A Part's instantiation of a reusable Feature definition, positioned
      on this specific Part.
    required: [feature, position, reference_face]
    properties:
      feature:
        $ref: "reference.schema.yaml#/$defs/reference"
      instance_parameters:
        type: object
        description: >
          Overrides/instantiation values for the referenced Feature's
          parameters (e.g. a concrete quantity or start_offset for this
          Part).
        additionalProperties: true
      position:
        type: object
        description: "Relative to the Part origin — see SchemaConventions.md."
        required: [x, y]
        properties:
          x: {$ref: "expression.schema.yaml#/$defs/expression"}
          y: {$ref: "expression.schema.yaml#/$defs/expression"}
        unevaluatedProperties: false
      reference_face:
        type: string
        enum: [front, back]
    unevaluatedProperties: false

  part:
    allOf:
      - $ref: "common.schema.yaml#/$defs/knowledge_object"
      - type: object
        required: [material, thickness, dimensions, reference_face, feature_instances]
        properties:
          material:
            $ref: "reference.schema.yaml#/$defs/reference"
          thickness:
            $ref: "expression.schema.yaml#/$defs/expression"
          dimensions:
            type: object
            required: [width, height]
            properties:
              width: {$ref: "expression.schema.yaml#/$defs/expression"}
              height: {$ref: "expression.schema.yaml#/$defs/expression"}
            unevaluatedProperties: false
          reference_face:
            type: string
            enum: [front, back]
            description: "Which face is being machined — see SchemaConventions.md."
          edge_banding:
            type: array
            items:
              type: object
              required: [edge, applied]
              properties:
                edge: {type: string, enum: [top, bottom, left, right]}
                applied: {type: boolean}
                material:
                  $ref: "reference.schema.yaml#/$defs/reference"
              unevaluatedProperties: false
          feature_instances:
            type: array
            items: {$ref: "#/$defs/feature_instance"}
    unevaluatedProperties: false
