# Material schema — draft v0.3 (v1 scope: 18mm Egger UK MFC only)
# A physical material a Part is made from, or an edge-band material bonded
# to a Part's edge. Rebuilt on the shared knowledge_object envelope
# (namespace, id, object_version, provenance, ...) — see
# docs/Specifications/MaterialSpecification.md.
#
# v0.3 deliberately narrows both branches to a single supported vocabulary
# for v1: 18mm Egger MFC (UK) for panel stock, 1mm/2mm Egger edge band for
# edge treatments. This is not a generic materials system — it is the
# smallest schema that can *reject* every material family, thickness, and
# manufacturer currently out of scope (MDF, plywood, solid timber, veneer
# board, laminates, 19mm/25mm board, anything not Egger/UK) structurally,
# via narrow enums, rather than via a semantic validator. A 36mm finished
# Part thickness is never a separate Material — it's a bonded construction
# of two 18mm layers, recorded on the Part itself (part.construction, see
# PartSpecification.md), not here.
#
# `material_type` splits panel stock from edge-band stock via the same
# allOf + const + unevaluatedProperties:false polymorphism already used by
# schemas/features/hole_array.schema.yaml and resolved_part.schema.yaml's
# `resolved_feature`.
$id: material.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
$ref: "#/$defs/material"
$defs:
  material_common:
    allOf:
      - $ref: "common.schema.yaml#/$defs/knowledge_object"
      - type: object
        required: [material_type]
        properties:
          material_type:
            type: string
            enum: [panel_stock, edge_band]

  panel_stock_material:
    allOf:
      - $ref: "#/$defs/material_common"
      - type: object
        required:
          - material_family
          - manufacturer
          - market
          - decor_code
          - decor_name
          - thickness_mm
        properties:
          material_type: {const: panel_stock}
          material_family:
            type: string
            enum: [mfc]
            description: >
              v1 scope: MFC only. Extend this enum (not a new field) when
              19mm/25mm veneer boards are actually introduced — see
              MaterialSpecification.md.
          manufacturer:
            type: string
            enum: [egger]
          market:
            type: string
            enum: [UK]
            description: "Market availability — v1 supports UK-available decors only."
          decor_code:
            type: string
            description: >
              Approved Egger UK decor code. The approved decor list lives
              as Material library data (one document per decor), not a
              schema enum — see MaterialSpecification.md.
          decor_name:
            type: string
          thickness_mm:
            type: number
            enum: [18]
            description: >
              v1 scope: 18mm only. A 36mm finished Part is a bonded
              construction of two 18mm layers (part.construction) — never
              a separate 36mm Material.
    unevaluatedProperties: false

  edge_band_material:
    allOf:
      - $ref: "#/$defs/material_common"
      - type: object
        required: [manufacturer, decor_code, decor_name, thickness_mm]
        properties:
          material_type: {const: edge_band}
          manufacturer:
            type: string
            enum: [egger]
          decor_code:
            type: string
            description: "The Egger decor this band matches (or the selected finish)."
          decor_name:
            type: string
          thickness_mm:
            type: number
            enum: [1, 2]
            description: >
              v1 scope: 1mm or 2mm only. Roll width, glue type, feed rate,
              and machine settings stay outside the v1 material contract —
              width lives on the Part's own edge_treatment.band.width_mm
              instead (see EdgeTreatmentSpecification.md).
    unevaluatedProperties: false

  material:
    oneOf:
      - $ref: "#/$defs/panel_stock_material"
      - $ref: "#/$defs/edge_band_material"
