x-dtml-schema: ../schemas/part.schema.yaml

namespace: cuttingedgebespoke.part
id: panel_with_groove
name: "Back panel — stopped groove example"
description: >
  Foundation-layer example: a single rectangular back panel with one
  reusable stopped-groove Feature instance, overriding the Feature's
  default length for this specific placement. Proves the schema chain
  Material -> Part -> Feature Instance -> Feature Definition -> Operation
  resolves and validates for a non-hole Feature type. See
  examples/straight_groove.feature.yaml and
  examples/router_groove.operation.yaml for the referenced Feature and
  Operation definitions.
schema_version: "0.1"
object_version: "1.0.0"
status: draft
provenance:
  source_type: narrated
  source_reference: "groove Feature work package, 2026-07-31"
  captured_by: lucian
  captured_at: "2026-07-31T00:00:00Z"
  confidence: confirmed
  review_status: approved
  reviewed_by: lucian
  evidence: []
tags: [example, foundation]

material:
  ref: cuttingedgebespoke.material.egger_w1000_18mm
  object_version: "1.0.0"

thickness:
  literal:
    value: 18
    unit: mm

construction: single_18mm

dimensions:
  width:
    literal:
      value: 500
      unit: mm
  height:
    literal:
      value: 300
      unit: mm

reference_face: front

edge_treatments:
  - edge: top
    treatment_type: edge_band
    band:
      material:
        ref: cuttingedgebespoke.material.white_abs_1mm
        object_version: "1.0.0"
      thickness_mm:
        literal: {value: 1, unit: mm}
      width_mm:
        literal: {value: 22, unit: mm}
  - edge: bottom
    treatment_type: edge_band
    band:
      material:
        ref: cuttingedgebespoke.material.white_abs_1mm
        object_version: "1.0.0"
      thickness_mm:
        literal: {value: 1, unit: mm}
      width_mm:
        literal: {value: 22, unit: mm}

feature_instances:
  - feature:
      ref: cuttingedgebespoke.feature.straight_groove
      object_version: "1.0.0"
    instance_parameters:
      length:
        literal:
          value: 350
          unit: mm
    position:
      x:
        literal:
          value: 50
          unit: mm
      y:
        literal:
          value: 150
          unit: mm
    reference_face: front
